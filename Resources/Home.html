<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#39343a;background:#faf8f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 32px 80px}.content{width:600px;max-width:100%;position:relative}.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#94878c;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:24px;height:1px;background:#b6a0aa}h1{font-family:Georgia,serif;font-size:clamp(45px,6.3vw,72px);font-weight:400;line-height:1.07;letter-spacing:-3px;margin:27px 0 23px}h1 em{font-weight:400;color:#a58ba8}p{font-size:14px;line-height:1.8;color:#91868c;max-width:390px;margin:0}.hint{margin-top:30px;display:inline-flex;align-items:center;gap:12px;font-size:12px;color:#80727c}kbd{font-family:inherit;font-size:11px;border:1px solid #ded6d9;border-bottom-width:2px;border-radius:6px;padding:5px 8px;background:#fffdfb}.links{display:flex;gap:12px;margin-top:58px}.links a{flex:1;text-decoration:none;color:#61545e;border:1px solid #e7e0df;border-radius:14px;padding:17px 18px;background:#fffcf9;transition:transform .2s,background .2s}.links a:hover{background:#f1e9ed;transform:translateY(-3px)}.links strong{display:block;font-weight:500;font-size:12px;margin:12px 0 5px}.links small{font-size:10px;color:#a3979e}.icon{font-size:18px;color:#a18a9c}.orbit{position:absolute;right:-120px;top:-180px;width:360px;height:360px;opacity:.45;pointer-events:none;z-index:-1}footer{display:flex;justify-content:space-between;padding:0 30px 24px;color:#b4a7ac;font-size:10px;letter-spacing:1px}.mark{display:inline-flex;align-items:center;gap:7px;font-family:Georgia,serif;font-size:17px;letter-spacing:-.5px;color:#b3a0ab}@media(max-width:650px){.orbit{right:-50px}.links{margin-top:38px;gap:8px}.links a{padding:14px 12px}h1{letter-spacing:-2px}main{padding:35px 30px}}
