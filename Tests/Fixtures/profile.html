<!doctype html>
<meta charset="utf-8">
<title>Bam Profile Fixture</title>
<style>body{font:16px system-ui;margin:32px}input{display:block;margin:12px 0;padding:8px}</style>
<h1>Local profile isolation fixture</h1>
<p>This page uses only this loopback origin's test cookie and local storage.</p>
<label>Unsaved draft<input id="draft" autocomplete="off"></label>
<script>
window.profileFixture = {
  writeAccount(value, persistent = false) {
    document.cookie = 'bam_profile_account=' + encodeURIComponent(value) + '; Path=/; SameSite=Lax' + (persistent ? '; Max-Age=3600' : '');
    localStorage.setItem('bam_profile_account', value);
  },
  snapshot() {
    const cookie = document.cookie.split('; ').find(value => value.startsWith('bam_profile_account='));
    return {
      cookie: cookie ? decodeURIComponent(cookie.slice('bam_profile_account='.length)) : '',
      storage: localStorage.getItem('bam_profile_account') || '',
      draft: document.querySelector('#draft').value,
      memory: window.profileMemorySentinel || ''
    };
  }
};
</script>
